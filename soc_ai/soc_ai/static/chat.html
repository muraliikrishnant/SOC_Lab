<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SOC AI Chat</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #161a1f; color: #e2e5e9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #chat { display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .msg { margin: 8px 0; max-width: 85%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
  .user { margin-left: auto; background: #2f6fed; color: white; }
  .assistant { margin-right: auto; background: #262b33; }
  .meta { font-size: 11px; color: #8a919c; margin-top: 4px; }
  #inputRow { display: flex; padding: 10px; border-top: 1px solid #2a2f37; gap: 8px; }
  #input { flex: 1; resize: none; border-radius: 8px; border: 1px solid #3a4048; background: #1e2229;
    color: #e2e5e9; padding: 8px 10px; font-size: 14px; }
  #send { border: none; border-radius: 8px; background: #2f6fed; color: white; padding: 0 16px; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="chat">
  <div id="log"></div>
  <div id="inputRow">
    <textarea id="input" rows="2" placeholder="Ask about a log line, an ATT&CK technique, a signature..."></textarea>
    <button id="send">Send</button>
  </div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
let history = [];

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function submit() {
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  send.disabled = true;
  addMsg('user', message);
  const thinking = addMsg('assistant', 'thinking...');
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, history})
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'request failed');
    thinking.textContent = data.reply;
    if (data.context_used && data.context_used.length) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'grounded on: ' + data.context_used.map(h => h.natural_id).join(', ');
      thinking.appendChild(document.createElement('br'));
      thinking.appendChild(meta);
    }
    history.push({role: 'user', content: message});
    history.push({role: 'assistant', content: data.reply});
  } catch (err) {
    thinking.textContent = 'Error: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener('click', submit);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
</script>
</body>
</html>
