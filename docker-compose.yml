services:
  # Elasticsearch - stores indexed logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    hostname: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - soc-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  # Kibana - Dashboard visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    hostname: kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - soc-network
    healthcheck:
      test: curl -s http://localhost:5601 >/dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  # Filebeat - Syslog ingestion
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    hostname: filebeat
    restart: always
    user: root
    ports:
      - "5001:5000/udp"
      - "5001:5000/tcp"
      - "514:514/udp"
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - soc-network
    command: filebeat -e -strict.perms=false

  # Ollama - AI threat analysis
  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - soc-network
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  # Neo4j - entity/relationship graph (hosts, users, IPs, hashes, ATT&CK techniques)
  neo4j:
    image: neo4j:5-community
    hostname: neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme123}
      - NEO4J_PLUGINS=[]
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    networks:
      - soc-network
    healthcheck:
      test: wget -q -O - http://localhost:7474 >/dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 10

  # Qdrant - vector store (alert embeddings, Sigma rules, ATT&CK techniques)
  qdrant:
    image: qdrant/qdrant:latest
    hostname: qdrant
    restart: always
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - soc-network

  # Splunk - primary SIEM target
  # No native arm64 image is published, so this runs under x86_64 emulation
  # on Apple Silicon (Docker Desktop handles this automatically via
  # Rosetta/QEMU) — slower to start, but functionally fine for a dev/demo
  # instance.
  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk
    restart: always
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-Changeme123!}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-soc-ai-hec-token}
    volumes:
      - splunk-data:/opt/splunk/var
      - ./soc_ai/splunk/default.yml:/tmp/defaults/default.yml:ro
      - ./soc_ai/splunk/apps/soc_ai_chat:/opt/splunk/etc/apps/soc_ai_chat
    ports:
      - "8000:8000"   # Splunk Web
      - "8088:8088"   # HTTP Event Collector (write-back)
      - "8089:8089"   # Management/REST API (polling)
    networks:
      - soc-network
    healthcheck:
      test: curl -sk https://localhost:8089/services/server/info >/dev/null || exit 1
      interval: 15s
      timeout: 10s
      retries: 20

  # soc-api - GraphRAG triage service (ingestion, entity extraction, graph+vector, LLM reasoning, reports)
  soc-api:
    build: ./soc_ai
    hostname: soc-api
    restart: always
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OLLAMA_URL=http://ollama:11434
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme123}
      - QDRANT_URL=http://qdrant:6333
      - SPLUNK_URL=https://splunk:8089
      - SPLUNK_HEC_URL=https://splunk:8088
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-soc-ai-hec-token}
      - SPLUNK_USER=admin
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-Changeme123!}
    volumes:
      - soc-api-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - elasticsearch
      - ollama
      - neo4j
      - qdrant
      - splunk
    networks:
      - soc-network

volumes:
  elasticsearch-data:
  ollama-data:
  neo4j-data:
  qdrant-data:
  splunk-data:
  soc-api-data:

networks:
  soc-network:
    driver: bridge
